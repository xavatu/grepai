services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grepai-postgres
    environment:
      POSTGRES_USER: grepai
      POSTGRES_PASSWORD: grepai
      POSTGRES_DB: grepai
    ports:
      - "5432:5432"
    volumes:
      - grepai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grepai"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Optional: Qdrant for vector storage
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # API HTTP & Dashboard
      - "127.0.0.1:6334:6334" # API gRPC
    volumes:
      - grepai-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    profiles:
      - qdrant

  # Optional: CUDA-accelerated second-stage reranker
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11058
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - grepai-reranker-cache:/root/.cache/huggingface
    command:
      - --hf-repo
      - ebasKing/Qwen3-Reranker-4B-GGUF-llama_cpp
      - --hf-file
      - Qwen3-Reranker-4B-Q6_K.gguf
      - --embedding
      - --reranking
      - --pooling
      - rank
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --parallel
      - "4"
      - --n-gpu-layers
      - "99"
      - --flash-attn
      - on
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m
    profiles:
      - reranker

  # Optional: Ollama for local embeddings (Linux only)
  # Uncomment the following to run Ollama in Docker
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: grepai-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - grepai-ollama:/root/.ollama
  #   # For GPU support (NVIDIA), add:
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]

volumes:
  grepai-pgdata:
  grepai-qdrant:
  grepai-reranker-cache:
  # grepai-ollama:
